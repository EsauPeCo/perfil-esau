# Server Block de Nginx para el perfil de Esaú Pérez.
#
# Mapeo de directorios:
#   URL                          ->  disco (dentro del contenedor)
#   http://localhost/perfil/     ->  /var/www/sitios/perfil/index.html
#   http://localhost/perfil/css/ ->  /var/www/sitios/perfil/css/
#
# Con "root /var/www/sitios" Nginx concatena la ruta pedida al directorio raíz,
# así que /perfil/img/x.webp se busca en /var/www/sitios/perfil/img/x.webp.

server {
    # Puertos: Nginx escucha en el 80 (HTTP) por IPv4 e IPv6. Docker publica
    # el 80 del contenedor en el 80 del equipo (ver docker-compose.yml).
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /var/www/sitios;
    charset utf-8;

    access_log /var/log/nginx/perfil.access.log;
    error_log  /var/log/nginx/perfil.error.log warn;

    # Compresión gzip para texto (el HTML, CSS y JS ya van minificados).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml;

    # La raíz del servidor manda a la aplicación.
    location = / {
        return 302 /perfil/;
    }

    # /perfil sin diagonal final redirige a /perfil/ para que las rutas
    # relativas (css/, js/, img/) se resuelvan bien.
    location = /perfil {
        return 301 /perfil/;
    }

    # La aplicación.
    location /perfil/ {
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Recursos estáticos: caché de 30 días en el navegador.
    location ~* ^/perfil/.+\.(css|js|webp|svg)$ {
        expires 30d;   # agrega Expires y Cache-Control: max-age=2592000
        access_log off;
        try_files $uri =404;
    }
}
